<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taibear 守門員</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup" id="popup">

    <!-- Header -->
    <div class="header">
      <div class="bear-logo"><img src="icons/icon48.png" alt="Taibear" /></div>
      <div class="header-text">
        <span class="brand">Taibear</span>
        <span class="tagline" data-i18n="tagline">訂房安全守門員</span>
      </div>
      <div class="badge" id="badge" data-i18n="scanning">確認中...</div>
    </div>

    <div class="divider"></div>

    <!-- State 1: Scanning -->
    <div class="state" id="state-scanning">
      <div class="scanning-body">
        <div class="spinner"></div>
        <p class="scanning-text" data-i18n="scanningBody">正在比對合法旅宿資料庫...</p>
      </div>
    </div>

    <!-- State 2: Safe -->
    <div class="state hidden" id="state-safe">
      <div class="hotel-info">
        <p class="hotel-name" id="hotel-name-safe"></p>
        <p class="hotel-addr" id="hotel-addr-safe"></p>
      </div>
      <div class="result-card safe">
        <p class="result-title" data-i18n="safeTitle">✓　這間旅宿合法有保障</p>
        <p class="result-desc" data-i18n="safeDesc">已登記於觀光署合法旅宿名冊，可安心入住。</p>
      </div>
      <p class="section-label" data-i18n="registrationInfo">登記資訊</p>
      <div class="checklist" id="checklist"></div>
      <div class="divider"></div>
      <button class="btn primary" id="btn-add" data-i18n="btnAdd">+ 加入 Taibear，以此安排行程</button>
      <button class="btn secondary" id="btn-official" data-i18n="btnOfficial">查看官方登記資料 →</button>
    </div>

    <!-- State 3: Unsafe -->
    <div class="state hidden" id="state-unsafe">
      <div class="hotel-info">
        <p class="hotel-name" id="hotel-name-unsafe"></p>
        <p class="hotel-addr" id="hotel-addr-unsafe"></p>
      </div>
      <div class="result-card unsafe">
        <p class="result-title" data-i18n="unsafeTitle">⚠　查無合法登記</p>
        <p class="result-desc" data-i18n="unsafeDesc">此房源未列於觀光署合法旅宿名冊，可能為非法業者。</p>
      </div>
      <p class="section-label" data-i18n="potentialRisks">潛在風險</p>
      <ul class="risk-list" id="risk-list"></ul>
      <div class="divider"></div>
      <button class="btn danger" id="btn-leave" data-i18n="btnLeave">離開此頁，找合法替代房源</button>
      <button class="btn secondary" id="btn-learn" data-i18n="btnLearn">了解非法旅宿風險 →</button>
      <p class="source-text" data-i18n="sourceText">資料來源：中央社報導、觀光署旅宿資料庫</p>
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
